name: ollama-qwen-0.5b-communication-smoke
world:
  width: 4
  height: 4
  toroidal: true
  initial_alive_probability: 0.28
game:
  rounds_per_encounter: 1
  communication:
    enabled: true
    mode: pre_encounter
    message_max_chars: 96
  payoff:
    reward: 3
    sucker: 0
    temptation: 5
    punishment: 1
simulation:
  generations: 1
  seed: 13
agents:
  backend: ollama
  strategy_weights:
    always_cooperate: 0.30
    always_defect: 0.20
    tit_for_tat: 0.30
    grim_trigger: 0.20
  fallback_strategy: tit_for_tat
  prompt_evolution:
    mutation_rate: 0.10
    mutation_step: 0.08
    style_options:
      - balanced
      - cautious
      - opportunistic
      - vengeful
  ollama:
    base_url: http://localhost:11434
    model: qwen2.5:0.5b
    temperature: 0.1
    timeout_seconds: 30
    require_model: true
    fallback_on_error: false
visualization:
  enabled: true
  interval: 1
  output_dir_name: viz
  render_ascii: true
output:
  root_dir: artifacts