name: ollama-qwen
world:
  width: 8
  height: 8
  toroidal: true
  initial_alive_probability: 0.30
game:
  rounds_per_encounter: 2
  payoff:
    reward: 3
    sucker: 0
    temptation: 5
    punishment: 1
simulation:
  generations: 4
  seed: 11
agents:
  backend: openai
  strategy_weights:
    always_cooperate: 0.30
    always_defect: 0.20
    tit_for_tat: 0.30
    grim_trigger: 0.20
  fallback_strategy: tit_for_tat
  prompt_evolution:
    mutation_rate: 0.20
    mutation_step: 0.10
    style_options:
      - balanced
      - cautious
      - opportunistic
      - vengeful
  openai:
    base_url: http://localhost:8080/v1
    model: /Users/jezzarax/Workspace/models/mlx-community/Qwen3.6-35B-A3B-mxfp4
    temperature: 1.0
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 1.5
    repetition_penalty: 1.0
    timeout_seconds: 30
    max_parallel_calls: 4
    require_model: true
    fallback_on_error: false
visualization:
  enabled: true
  interval: 1
  output_dir_name: viz
  render_ascii: true
output:
  root_dir: artifacts
