[project]
name = "archons"
version = "0.1.0"
description = "Hybrid Prisoner's Dilemma and Game of Life simulator for local LLM societies"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "matplotlib>=3.10.1",
  "openai>=2.32.0",
  "pydantic>=2.11.3",
  "python-dotenv>=1.2.2",
  "pyyaml>=6.0.2",
  "typer>=0.15.2",
]

[dependency-groups]
dev = ["pytest>=8.3.5", "pytest-asyncio>=1.3.0"]

[project.scripts]
archons = "archons.cli:app"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["archons"]

[tool.pytest.ini_options]
testpaths = ["tests"]
